{% extends 'base.html' %}
{% load static %}

{% block title %}铲屎官进站暗号 🐾{% endblock %}

{% block content %}
<div class="container" style="margin-top: 70px; margin-bottom: 90px;">
    <div class="row" style="display: flex; justify-content: center; align-items: center;">
        <div class="col-md-5" style="width: 100%; max-width: 440px;">
            <div style="background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(167, 196, 188, 0.2); border: 1px solid rgba(167, 196, 188, 0.25);">
                
                <div class="text-center" style="text-align: center; margin-bottom: 30px;">
                    <h3 style="color: #4A4E69; font-weight: bold; margin-bottom: 8px; font-size: 22px;">欢迎回到喵步星球 🐾</h3>
                    <p style="color: #7F8C8D; font-size: 14px;">请输入铲屎官绑定账号与进门暗号</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    {% if error %}
                        <div style="background-color: #FADBD8; color: #78281F; padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; border-left: 4px solid #E74C3C;">
                            <i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i> {{ error }}
                        </div>
                    {% endif %}

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: #4A4E69; font-size: 14px; font-weight: 500;">喵星账号</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required 
                               style="width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(167, 196, 188, 0.5); outline: none; font-size: 14px; transition: all 0.3s;">
                    </div>

                    <div class="form-group" style="margin-bottom: 30px;">
                        <label style="display: block; margin-bottom: 8px; color: #4A4E69; font-size: 14px; font-weight: 500;">进门暗号 (密码)</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required 
                               style="width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(167, 196, 188, 0.5); outline: none; font-size: 14px; transition: all 0.3s;">
                    </div>

                    <button type="submit" class="btn-login-submit" 
                            style="width: 100%; background-color: #A7C4BC; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 12px; font-size: 16px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(167, 196, 188, 0.3);">
                        开启吸猫之旅 🚀
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<style>
    /* 输入框聚焦时的发光效果 */
    .form-control:focus {
        border-color: #A7C4BC !important;
        box-shadow: 0 0 8px rgba(167, 196, 188, 0.4);
    }
    /* 按钮悬停时，优雅切成暖橙色，产生视觉动感 */
    .btn-login-submit:hover {
        background-color: #FF9F89 !important;
        box-shadow: 0 6px 20px rgba(255, 159, 137, 0.4) !important;
        transform: translateY(-1px);
    }
    .btn-login-submit:active {
        transform: translateY(1px);
    }
</style>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block title %}注册成为铲屎官 🐾{% endblock %}

{% block content %}
<div class="container" style="margin-top: 70px; margin-bottom: 90px;">
    <div class="row" style="display: flex; justify-content: center; align-items: center;">
        <div class="col-md-5" style="width: 100%; max-width: 440px;">
            <div style="background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(167, 196, 188, 0.2); border: 1px solid rgba(167, 196, 188, 0.25);">

                <div class="text-center" style="text-align: center; margin-bottom: 30px;">
                    <h3 style="color: #4A4E69; font-weight: bold; margin-bottom: 8px; font-size: 22px;">🐱 加入喵步星球</h3>
                    <p style="color: #7F8C8D; font-size: 14px;">创建你的铲屎官账号，开启喵星探险之旅</p>
                </div>

                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}

                    {% if error %}
                        <div style="background-color: #FADBD8; color: #78281F; padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; border-left: 4px solid #E74C3C;">
                            <i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i> {{ error }}
                        </div>
                    {% endif %}

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: #4A4E69; font-size: 14px; font-weight: 500;">🐾 喵星账号</label>
                        <input type="text" name="username" class="form-control" placeholder="取个独一无二的名字吧~" value="{{ request.GET.username }}" required
                               style="width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(167, 196, 188, 0.5); outline: none; font-size: 14px; transition: all 0.3s;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: #4A4E69; font-size: 14px; font-weight: 500;">🔑 进门暗号 (密码)</label>
                        <input type="password" name="password" class="form-control" placeholder="至少6位，要保密哦~" required
                               style="width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(167, 196, 188, 0.5); outline: none; font-size: 14px; transition: all 0.3s;">
                    </div>

                    <div class="form-group" style="margin-bottom: 30px;">
                        <label style="display: block; margin-bottom: 8px; color: #4A4E69; font-size: 14px; font-weight: 500;">🔐 再输一次暗号</label>
                        <input type="password" name="password2" class="form-control" placeholder="确认你的暗号~" required
                               style="width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(167, 196, 188, 0.5); outline: none; font-size: 14px; transition: all 0.3s;">
                    </div>

                    <button type="submit" class="btn-register-submit"
                            style="width: 100%; background-color: #FF9F89; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 12px; font-size: 16px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(255, 159, 137, 0.3);">
                        🐾 注册成为铲屎官
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px;">
                    <span style="color: #7F8C8D; font-size: 13px;">已经有账号了？</span>
                    <a href="{% url 'login' %}" style="color: #A7C4BC; font-weight: bold; text-decoration: none; font-size: 13px;">去登录 🚀</a>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #FF9F89 !important;
        box-shadow: 0 0 8px rgba(255, 159, 137, 0.4);
    }
    .btn-register-submit:hover {
        background-color: #A7C4BC !important;
        box-shadow: 0 6px 20px rgba(167, 196, 188, 0.4) !important;
        transform: translateY(-1px);
    }
    .btn-register-submit:active {
        transform: translateY(1px);
    }
</style>
{% endblock %}
